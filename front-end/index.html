<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>客服工单台</title>
    <!--
      主题要在画第一帧之前定下来，所以它不能住在 src/ 里（模块脚本天生 defer）。
      用外部同源脚本而不是内联：<script src> 是经典脚本，会阻塞解析并在 body 之前跑完，
      而后端 CSP 是 script-src 'self'，内联的那一种会被浏览器拦掉。原因写在
      public/theme-boot.js 的注释里，接线由 src/shared/lib/themeBoot.test.ts 钉住。
    -->
    <script src="./theme-boot.js"></script>
  </head>
  <body class="bg-crust text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
