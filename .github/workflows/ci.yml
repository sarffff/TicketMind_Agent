name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: 后端测试 (pytest)
    runs-on: ubuntu-latest
    env:
      # config.py 在导入期就校验 JWT 密钥不是默认占位符,CI 里没有 .env,
      # 必须显式给一个(仅用于测试,不签发任何真实 token)
      JWT_SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      WORKING_DIR: back-end
      # 测试需要的最小配置
      DATABASE_URL: "sqlite:///:memory:"
      LLM_API_KEY: test-key
      LLM_BASE_URL: https://example.invalid/v4/
      RERANK_API_KEY: test-key
      RERANK_BASE_URL: https://example.invalid/v4/
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: back-end/requirements.txt
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 提示词契约校验(模板缺失/占位符漂移直接失败)
        run: python -c "from services import prompt_library; prompt_library.validate()"
      - name: 运行测试
        run: python -m pytest -v --tb=short
      # 这套门禁离线、不花钱、没有网络依赖，判的是"该挂审的挂了吗、退款重复了吗、
      # 超额了吗、委派有没有绕过审批"。它不在 CI 上的一天，改坏工单图就可以安静地
      # 合进 main。
      - name: 工单护栏门禁（漏投一次审批就红）
        run: python -m eval.ticket_guardrail --fail-on-breach

  schema:
    name: 迁移与 schema（MySQL 空库从零）
    runs-on: ubuntu-latest
    # 为什么要专门起一个 MySQL 跑这件事：开发期根本走不到这条路径。init_db 用的是
    # create_all + stamp，压根不执行迁移；于是 0001_baseline 跟着 models.py 漂移了
    # 很久都没人发现——新库里 documents 一出生就带着 content_hash，alembic upgrade
    # head 跑到 0006 撞 Duplicate column name，整条链在空库上从头跑不通，而 README
    # 的手动部署路径写的正是这一条。这个 job 就是把"新环境能不能建起来"钉成门禁。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: ticketmind_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      JWT_SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      WORKING_DIR: back-end
      DATABASE_URL: "mysql+pymysql://root:ci-root-password@127.0.0.1:3306/ticketmind_schema"
      LLM_API_KEY: test-key
      LLM_BASE_URL: https://example.invalid/v4/
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: back-end/requirements.txt
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 空库上跑完整条迁移链
        run: alembic upgrade head
      # --gate 是这条路径上唯一的判红方式：脚本默认"拿到结论就返回 0"（启动体检要靠
      # 那个契约把"检查不可用"和"库要迁移"分开），CI 要的恰恰是后者为真就红。
      - name: 版本与表级差集必须合格
        run: python scripts/check_schema_drift.py --gate
      - name: 再跑一次 upgrade 必须是幂等的
        run: alembic upgrade head

  frontend:
    name: 前端构建 (tsc + vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4
      # 22 而不是 20：pnpm 11 require 了 node:sqlite，那是 Node 22.5 起才有的
      # 内置模块，在 20 上直接 ERR_UNKNOWN_BUILTIN_MODULE。pnpm 自己也会先 warn
      # "requires at least Node.js v22.13"。
      #
      # 方向是把 CI 抬到锁文件那一侧，而不是把 pnpm 降回 9：锁文件已经是 pnpm 11
      # 写的，降 pnpm 就回到上一个 commit 修掉的那个 pnpmfileChecksum 不匹配。
      # 打包出去的 Electron 自带 Node 运行时，所以这个版本只影响构建工具链。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 版本只来自 front-end/package.json 的 packageManager（当前 pnpm@11.20.0）。
      # 原来钉的是 v2 + version: 9，而锁文件是 pnpm 11 写的——pnpm 10 起会写
      # pnpmfileChecksum，pnpm 9 读那份锁文件算出的校验和对不上，
      # --frozen-lockfile 就失败。报错建议的 --no-frozen-lockfile 不能照做：
      # 那等于让 CI 自己改锁文件，正是 --frozen-lockfile 要防的事。
      #
      # 这个 job 的 working-directory 是 front-end，但 uses: 步骤不继承它，
      # 所以要显式指出 package.json 在哪——仓库根没有那份文件。
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: front-end/package.json
      - name: 安装依赖
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: 类型检查
        run: pnpm tsc --noEmit
      - name: 单元测试 (vitest)
        run: pnpm test
      - name: 构建
        run: pnpm vite build
