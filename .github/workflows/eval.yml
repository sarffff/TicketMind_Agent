name: 评估门禁

# **不挂在 push / pull_request 上。** 这条流水线会打真实的模型调用:54 题 × 变体数,
# 一次几分钟、花真钱。挂在每个 PR 上的结果是要么大家开始跳过它,要么账单失控。
#
# 两个触发方式:
#   - 手动(workflow_dispatch):改了检索、提示词、语料之后自己点一次
#   - 每天一次(schedule):抓那些"没人改检索但它自己变了"的情况——提供商换模型、
#     语料被人在界面上改了、依赖升级
#
# 门禁的判定逻辑与阈值在 back-end/eval/gate.py 与 gate_thresholds.json,
# 本地可以用同一套跑:`python -m eval.gate <报告>`。CI 和本地判的是同一件事,
# "我这儿是过的"才有意义。
#
# 两个 job,各判一件事:rag-eval 判检索质量,ticket-eval 判工单侧的模型行为
# (会不会提出不该提的操作、会不会对客户说台账里没有的话)。串行,原因见 ticket-eval。
on:
  workflow_dispatch:
    inputs:
      variants:
        description: "跑哪些变体(逗号分隔),留空用默认集"
        required: false
        default: ""
      limit:
        description: "只跑前 N 题(留空跑全部;调试用)"
        required: false
        default: ""
  schedule:
    # 每天 UTC 19:00 = 北京时间次日 03:00。避开整点:所有人都写 0 0 * * *,
    # 那个时刻的 API 配额最紧
    - cron: "17 19 * * *"

# 同一时刻只跑一份:评估会打满账号的每分钟配额(2026-08-27 那次 211 个 429 就是
# 这么来的),两份并行只会让两份都降级
concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rag-eval:
    name: RAG 评估 + 门禁
    runs-on: ubuntu-latest
    # 评估比单测慢得多,给足;真卡住了也不该占满一小时
    timeout-minutes: 45
    env:
      JWT_SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      WORKING_DIR: back-end
      DATABASE_URL: "sqlite:///./eval_ci.db"
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      RERANK_API_KEY: ${{ secrets.RERANK_API_KEY }}
      RERANK_BASE_URL: ${{ secrets.RERANK_BASE_URL }}
      # 评估自己的限流退避。默认值就是为这条路径调的,显式写出来是因为
      # CI 上一旦撞 429,报告会静默降级成一份"看起来像模型变差了"的假回归
      EVAL_LLM_MIN_INTERVAL_SECONDS: "0.5"
      EVAL_LLM_RATE_LIMIT_COOLDOWN_SECONDS: "8"
      EVAL_LLM_MAX_RATE_RETRIES: "12"
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4

      - name: 缺少凭据时明确跳过
        id: guard
        run: |
          if [ -z "${LLM_API_KEY}" ]; then
            echo "未配置 LLM_API_KEY，跳过评估。"
            echo "在仓库 Settings → Secrets 里配置后本流水线才会真正运行。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip == 'false'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: back-end/requirements.txt

      - name: 安装依赖
        if: steps.guard.outputs.skip == 'false'
        run: pip install -r requirements.txt

      - name: 跑评估
        if: steps.guard.outputs.skip == 'false'
        run: |
          args=""
          if [ -n "${{ github.event.inputs.variants }}" ]; then
            args="$args --variants ${{ github.event.inputs.variants }}"
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            args="$args --limit ${{ github.event.inputs.limit }}"
          fi
          python -m eval.run $args --quiet

      - name: 判门禁
        if: steps.guard.outputs.skip == 'false'
        id: gate
        run: |
          set +e
          python -m eval.gate
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 退出码的语义(见 eval/gate.py 的模块文档):
          #   0 达标  1 质量/安全回归  2 运行不可信  3 用法错误
          #
          # 2 单独处理:那说明测量本身坏了(限流打空答案、语料分块数变了),
          # 此时报"质量回归"是误诊,该做的是重跑或修环境,而不是去查模型。
          case $code in
            0) echo "::notice::评估门禁通过" ;;
            2) echo "::warning::运行不可信——测量坏了,不是模型变差。先修环境再重跑。" ;;
            3) echo "::error::门禁用法错误(报告缺失或阈值文件坏了)" ;;
            *) echo "::error::评估门禁不达标:质量或安全指标低于阈值" ;;
          esac
          exit $code

      - name: 上传报告
        # always():门禁失败时报告**更**需要留档——那正是要拿来看的东西
        if: always() && steps.guard.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.run_id }}
          path: back-end/eval/reports/eval-*
          retention-days: 30
          if-no-files-found: warn

  # 工单侧的行为评估。和 RAG 那一 job 同一次触发、同样花真钱，所以同样不挂 push。
  #
  # 为什么值得单开一个 job 而不是往 rag-eval 里加两步：两个评估判的是完全不同的东西
  # （检索质量 vs 模型会不会提出不该提的操作），失败时也各修各的。混在一个 job 里，
  # RAG 撞 429 会把工单那一半一起标红，而那是两条互不相干的链路。
  #
  # 门禁判的是 safety 那一档：空头承诺与超额退款提案，等号 0 是唯一可接受值。
  # 提案越界（提了场景外的工具）**只报数不判红**——那需要基线，而这套评估至今
  # 一次都没真跑过。第一次跑出来之后再回 gate_thresholds.json 补阈值。
  ticket-eval:
    name: 工单行为评估 + 门禁
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 串行，不并行。文件开头那条 concurrency 只管"两次运行之间"，管不到同一次运行里
    # 的两个 job——而它们打的是同一个账号的配额。2026-08-27 那次 211 个 429 就是
    # 并行打满每分钟配额来的，两份报告当时都降级成了"看起来像模型变差了"的假回归。
    #
    # if: always() 是必须的：RAG 那侧门禁失败不该让工单这一侧变成 skipped——
    # 那是两条互不相干的链路，各自的红要各自能看见。
    needs: rag-eval
    if: always()
    env:
      JWT_SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      WORKING_DIR: back-end
      DATABASE_URL: "sqlite:///./ticket_behavior_ci.db"
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      EVAL_LLM_MIN_INTERVAL_SECONDS: "0.5"
      EVAL_LLM_RATE_LIMIT_COOLDOWN_SECONDS: "8"
      EVAL_LLM_MAX_RATE_RETRIES: "12"
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4

      - name: 缺少凭据时明确跳过
        id: guard
        run: |
          if [ -z "${LLM_API_KEY}" ]; then
            echo "未配置 LLM_API_KEY，跳过工单行为评估。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip == 'false'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: back-end/requirements.txt

      - name: 安装依赖
        if: steps.guard.outputs.skip == 'false'
        run: pip install -r requirements.txt

      # 价目表决定报告里的成本列。缺了它成本全是"未知"——那是诚实的，但每天一次的
      # 趋势线就少了一条能用来判断"这次改动值不值"的轴。
      - name: 准备价目表
        if: steps.guard.outputs.skip == 'false'
        run: |
          if [ ! -f model_prices.json ] && [ -f model_prices.example.json ]; then
            cp model_prices.example.json model_prices.json
          fi

      - name: 跑评估
        if: steps.guard.outputs.skip == 'false'
        run: |
          args="--report eval/reports/ticket-behavior-latest.json"
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            args="$args --limit ${{ github.event.inputs.limit }}"
          fi
          # --judge 刻意不加：每案多一次调用，而裁判结论会随模型与温度抖。
          # 先看确定性的那两条硬判据，需要裁判时手动跑。
          python -m eval.ticket_behavior $args

      - name: 判门禁
        if: steps.guard.outputs.skip == 'false'
        run: |
          set +e
          python -m eval.gate eval/reports/ticket-behavior-latest.json
          code=$?
          set -e
          case $code in
            0) echo "::notice::工单行为门禁通过" ;;
            2) echo "::warning::运行不可信——工单条数或模型调用数不够，安全结论不可读。先重跑。" ;;
            3) echo "::error::门禁用法错误(报告缺失或阈值文件坏了)" ;;
            *) echo "::error::工单安全门禁不达标：模型对客户说了台账里没有的话，或提出了超额退款" ;;
          esac
          exit $code

      - name: 上传报告
        if: always() && steps.guard.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ticket-behavior-report-${{ github.run_id }}
          path: back-end/eval/reports/ticket-behavior-*
          retention-days: 30
          if-no-files-found: warn
